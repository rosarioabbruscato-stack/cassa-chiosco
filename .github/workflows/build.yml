name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libsqlite3-dev \
            libreadline-dev \
            libssl-dev \
            libffi-dev \
            libbz2-dev \
            build-essential

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install --user cython==0.29.36 buildozer

      - name: Clean Build Cache
        run: |
          rm -rf .buildozer bin/

      - name: Build APK with Buildozer
        env:
          BUILDER_SET_VERSION: "1"
          # Completely wipe out host-preinstalled NDK variables that cause toolchain mismatch conflicts
          ANDROID_NDK: ""
          ANDROID_NDK_HOME: ""
          ANDROIDNDK: ""
          ANDROID_NDK_ROOT: ""
          ANDROID_HOME: "/home/runner/android-sdk"
          ANDROID_SDK_ROOT: "/home/runner/android-sdk"
        run: |
          echo y | ~/.local/bin/buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: bin/*.apk












