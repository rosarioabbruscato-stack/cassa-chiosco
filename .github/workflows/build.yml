name: Build APK

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$ANDROID_SDK_ROOT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip git zip unzip swig libltdl-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --user cython==0.29.36 buildozer

      - name: Clean Build Cache
        run: |
          rm -rf .buildozer bin/

      - name: Build APK with Buildozer
        env:
          BUILDER_SET_VERSION: "1"
        run: |
          unset ANDROIDNDK
          unset ANDROID_NDK
          unset ANDROID_NDK_HOME
          unset ANDROID_NDK_ROOT
          unset ANDROID_NDK_LATEST_HOME

          echo y | ~/.local/bin/buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: bin/*.apk









     


