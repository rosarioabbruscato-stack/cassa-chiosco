name: Build APK

on:
  push:
    branches: [principale, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Android APK
        shell: bash
        run: |
          docker run --rm \
            -e BUILDOZER_WARN_ON_ROOT=0 \
            -v "$PWD:/home/user/hostcwd" \
            -w /home/user/hostcwd \
            --entrypoint /bin/bash \
            kivy/buildozer:latest \
            -lc '
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive

              apt-get update
              apt-get install -y --no-install-recommends \
                curl ca-certificates unzip zip \
                build-essential pkg-config libssl-dev

              if ! command -v rustup >/dev/null 2>&1; then
                curl --proto "=https" --tlsv1.2 -fsSL https://sh.rustup.rs \
                  | sh -s -- -y --profile minimal
              fi
              export PATH="$HOME/.cargo/bin:$PATH"
              rustup --version
              rustc --version
              cargo --version

              SDK="$HOME/.buildozer/android/platform/android-sdk"
              mkdir -p "$SDK/cmdline-tools" "$SDK/licenses"

              if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
                curl -fL --retry 3 \
                  -o /tmp/android-commandlinetools.zip \
                  https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
                mkdir -p /tmp/android-commandlinetools
                unzip -q /tmp/android-commandlinetools.zip -d /tmp/android-commandlinetools
                mv /tmp/android-commandlinetools/cmdline-tools "$SDK/cmdline-tools/latest"
              fi

              SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
              test -x "$SDKMANAGER"

              printf "%s\n" \
                "8933bad161af4178b1185d1a37fbf41ea5269c55" \
                "d56f5187479451eabf01fb78af6dfcb131a6481e" \
                > "$SDK/licenses/android-sdk-license"

              "$SDKMANAGER" --sdk_root="$SDK" \
                "platform-tools" \
                "platforms;android-36" \
                "build-tools;35.0.0"

              echo "Installed SDK Build-Tools directories:"
              ls -la "$SDK/build-tools" || true
              find "$SDK/build-tools" -maxdepth 2 -name aidl -type f -print || true

              AIDL="$SDK/build-tools/35.0.0/aidl"
              if [ ! -f "$AIDL" ]; then
                echo "ERROR: AIDL absent after installing build-tools;35.0.0" >&2
                "$SDKMANAGER" --sdk_root="$SDK" --list_installed || true
                exit 1
              fi
              if [ ! -x "$AIDL" ]; then
                echo "ERROR: AIDL exists but is not executable: $AIDL" >&2
                ls -l "$AIDL"
                exit 1
              fi
              echo "AIDL verified: $AIDL"
              ls -l "$AIDL"
              "$AIDL" --version || true

              buildozer -v android debug
            '

      - name: Verify APK
        shell: bash
        run: |
          ls -lh bin/ || true
          compgen -G 'bin/*.apk' > /dev/null

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: myapp-debug
          path: bin/*.apk
          if-no-files-found: error
