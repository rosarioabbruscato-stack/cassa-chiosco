name: Build APK

on:
  push:
    branches: [ principale, main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with Buildozer Docker
        run: |
          docker run --rm \
            -e BUILDOZER_WARN_ON_ROOT=0 \
            -v "$PWD":/home/user/hostcwd \
            -w /home/user/hostcwd \
            --entrypoint /bin/bash \
            kivy/buildozer:latest \
            -lc '
              mkdir -p /home/user/.buildozer/android/platform/android-sdk/licenses

              printf "%s\n" \
                "8933bad161af4178b1185d1a37fbf41ea5269c55" \
                "d56f5187479451eabf01fb78af6dfcb131a6481e" \
                > /home/user/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

              yes | buildozer -v android debug
            '

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: myapp-debug
          path: bin/*.apk
