name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Imposta Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installa dipendenze di sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              git zip unzip openjdk-17-jdk python3-pip \
              autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
              libncursesw5-dev cmake libffi-dev libssl-dev lld

      - name: Installa Buildozer e dipendenze Python
        run: |
          pip install --upgrade pip
          pip install --user --upgrade buildozer cython==0.29.36 python-for-android
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Compila APK con Buildozer
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          buildozer -v android debug

      - name: Carica l'APK come Artefatto
        uses: actions/upload-artifact@v4
        with:
          name: pacchetto-apk
          path: bin/*.apk






















