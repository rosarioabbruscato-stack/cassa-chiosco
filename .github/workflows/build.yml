name: Risparmio per build cloud

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonare il repository
        uses: actions/checkout@v4

      - name: Impostare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installare dipendenze di sistema e Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install --user --upgrade buildozer cython
          # Aggiunge la cartella bin locale dell'utente al PATH di GitHub Actions
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Compilare l'APK con Buildozer
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          buildozer -v android debug

      - name: Caricare l'APK come Artefatto
        uses: actions/upload-artifact@v4
        with:
          name: cassa-chiosco-apk
          path: bin/*.apk
