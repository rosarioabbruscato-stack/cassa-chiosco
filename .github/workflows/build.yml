name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest

    steps:
      - uses: actions/checkout@v4

    - name: Compila APK
      run: |
        git config --global --add safe.directory /__w/cassa-chiosco/cassa-chiosco
        export BUILDER_SET_VERSION=1
        yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: bin/*.apk












