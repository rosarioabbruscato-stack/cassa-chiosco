name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libsqlite3-dev libreadline-dev libffi-dev libssl-dev

      - name: Install Buildozer and dependencies
        run: |
          pip install --upgrade pip
          pip install --user Cython==0.29.36 buildozer

      - name: Compila APK
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          
          # Rimuove totalmente qualsiasi traccia dell'NDK r28c scaricato da github o buildozer
          rm -rf /home/runner/.buildozer/android/platform/android-ndk-r28c
          
          # Configura rigorosamente tutte le variabili d'ambiente per puntare esclusivamente all'r25b
          export ANDROID_NDK_HOME="/home/runner/.buildozer/android/platform/android-ndk-r25b"
          export ANDROID_NDK_ROOT="/home/runner/.buildozer/android/platform/android-ndk-r25b"
          export ANDROIDNDK="/home/runner/.buildozer/android/platform/android-ndk-r25b"
          
          # Esegue buildozer pulendo eventuali build precedenti corrotte
          buildozer clean
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: bin/*.apk






















