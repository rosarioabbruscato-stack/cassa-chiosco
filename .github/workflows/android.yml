name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y build-essential libffi-dev python3-dev \
          git zip unzip openjdk-17-jdk ffmpeg libsdl2-dev libsdl2-image-dev \
          libsdl2-mixin-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev \
          libavformat-dev libavcodec-dev zlib1g-dev ccache libncurses5:i386 \
          libstdc++6:i386 zlib1g:i386

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip setuptools
        pip install buildozer cython

    - name: Build APK with Buildozer
      run: |
        yes | buildozer -v android debug
      env:
        ACCEPT_BUILD_TOOLS_CHECKSUMS: true

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: CassaChiosco-APK
        path: bin/*.apk
