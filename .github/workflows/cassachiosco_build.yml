name: CassaChiosco Build

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java 11
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies & Autotools fixes
        run: |
          sudo add-apt-repository universe
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y             build-essential             git             ffmpeg             libsdl2-dev             libsdl2-image-dev             libsdl2-mixer-dev             libsdl2-ttf-dev             libportmidi-dev             libswscale-dev             libavformat-dev             libavcodec-dev             zlib1g-dev             libffi-dev             libssl-dev             autoconf             automake             libtool             libltdl-dev             pkg-config             zip             unzip             libncurses6:i386             libstdc++6:i386             zlib1g:i386
          echo "ACLOCAL_PATH=/usr/share/aclocal" >> $GITHUB_ENV

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install cython==0.29.36 buildozer

      - name: Build APK with Buildozer
        run: |
          buildozer clean || true
          rm -rf ~/.buildozer
          buildozer -v android debug || { echo "=== MOSTRGO ULTIMI LOG DI BUILDOZER ==="; find ~/.buildozer -name "build.log" -exec tail -n 100 {} \;; exit 1; } || { find . -name "build.log" -exec echo "=== LOG FOUND: {} ===" \; -exec tail -n 150 {} \; ; exit 1; } || {
            echo '=== CERCO IL LOG DI BUILD DI BUILDOZER ==='
            find .buildozer -name 'build.log' -exec cat {} + || true
            exit 1
          }

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
